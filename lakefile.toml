name = "fvtrace"
version = "0.1.0"
description = "Shows which scientific claims an analysis can and cannot make, under a formal-verification stance."
keywords = ["formal-verification", "science", "claims", "provenance"]
license = "Apache-2.0 WITH LLVM-exception"
licenseFiles = ["LICENSE"]
readmeFile = "README.md"
defaultTargets = ["fvtrace"]
testDriver = "«fvtrace-tests»"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[lean_lib]]
name = "Fvtrace"

[[lean_exe]]
name = "fvtrace"
root = "Main"

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "fvtrace-tests"
root = "TestMain"

# Dev-only audit: imports `Lean` (a 118 MB link), so it stays out of the shipped binary.
[[lean_exe]]
name = "fvtrace-trust"
root = "TrustMain"
supportInterpreter = true
