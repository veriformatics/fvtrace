# A `v*` tag publishes a release: build.yml's archives (page engine built from scratch), then each
# archive downloaded from the release and checked on its own platform, as a user would get it.
# A `ci/release-*` branch runs the same jobs without publishing: the check reads the build's
# artifacts instead. A manual run (`gh workflow run release.yml -f tag=vX.Y.Z`) checks a published
# release's archives again on today's runners, from that tag's tree (.claude/rules/release.md).
name: release

on:
  push:
    tags: ["v*"]
    branches: ["ci/release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to check again (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    uses: $/.github/workflows/build.yml
    with:
      release: true

  publish:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # creates the release + uploads its assets
      actions: read # reads the tagged commit's gate runs
      id-token: write # signs the provenance attestation (Sigstore)
      attestations: write # stores it with the repository
    steps:
      # A tag publishes only what main's full gate passed (user ruling 2026-10-31).
      - name: Require a green gate on main for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gate --branch main \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          [[ "$green" -ge 1 ]] || { echo "release: $GITHUB_SHA has no green gate run on main" >&2; exit 1; }

      - name: Collect the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fvtrace-*
          path: dist
          merge-multiple: true

      # The tag names the version: archives built from another version publish (and attest) nothing.
      - name: Check that every archive names the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          expected=()
          for a in linux-x86_64.tar.gz linux-arm64.tar.gz macos-arm64.tar.gz windows-x86_64.zip; do
            for f in "dist/fvtrace-$version-$a" "dist/fvtrace-$version-$a.sha256"; do
              [[ -f "$f" && ! -L "$f" ]] || { echo "release: no $f (regular file required; tag $TAG)" >&2; exit 1; }
              expected+=("$f")
            done
          done
          shopt -s nullglob dotglob
          for f in dist/*; do
            allowed=0
            for want in "${expected[@]}"; do
              [[ "$f" == "$want" ]] && allowed=1
            done
            [[ "$allowed" -eq 1 ]] || { echo "release: unexpected archive file $f (tag $TAG)" >&2; exit 1; }
          done

      # Signed SLSA provenance per archive (user ruling 2026-10-31): `gh attestation verify
      # <archive> -R veriformatics/fvtrace` proves this repository's workflow built it.
      - name: Attest the archives' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fvtrace-*.tar.gz
            dist/fvtrace-*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "fvTrace $version" \
            --notes "Download the archive for your system and the .sha256 file beside it. The README (Install) shows how to check and install it."

  installed:
    name: installed (${{ matrix.target }})
    needs: [build, publish]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.build.result == 'success' && needs.publish.result != 'failure')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: linux-x86_64
          - os: ubuntu-26.04-arm
            target: linux-arm64
          # The oldest arm64 macOS runner = tools/release.sh macos_min: the program runs on its floor.
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TARGET: ${{ matrix.target }}
      # The published release this job checks (none on a `ci/release-*` dry run).
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Require a release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: $TAG is not vX.Y.Z" >&2; exit 1; }

      # The synthetic study + tools/release.sh of the release's own tree; no Lean, no build.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit, not the branch: tools/ci-gate.sh deletes a green `ci/release-*` branch early.
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false

      - name: Download the archive from the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "fvtrace-*-$TARGET.*"

      - name: Download the archive from the build
        if: env.TAG == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fvtrace-${{ matrix.target }}
          path: dist

      - name: Check the archive
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            version="${TAG#v}"
          else
            version="$(sed -n 's/^def version : String := "\(.*\)"$/\1/p' Fvtrace/Version.lean)"
          fi
          bash tools/release.sh check dist "$TARGET" "$version"
