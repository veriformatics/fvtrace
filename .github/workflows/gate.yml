# CI runs the same command a human and an agent run (tools/gate.sh); calling a tool directly
# here would let CI and the local gate drift into two claims.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  # Advisory databases + scanner rules move without commits; a weekly run surfaces that.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads the whole history.
          fetch-depth: 0

      - name: Install the Lean toolchain named in lean-toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: "false"
          use-github-cache: "false"

      # The exported page's engine is built by `lake build`: Emscripten runs on Python >= 3.10.
      - name: Install Python for the page engine build
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the dev toolchain + browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium-headless-shell

      # `lake check` sandboxes the replay in bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu 24.04 restricts them through AppArmor by default.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap shellcheck jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the gate
        run: bash tools/gate.sh

  # The shipped binary must build + pass its tests on every platform a user may run.
  portability:
    name: portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `lake build` builds the exported page's engine with Emscripten, which runs on Python.
      - name: Install Python for the page engine build
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Lean's Windows toolchain targets the MinGW ABI; the C digest code builds with MinGW gcc.
      - name: Select the C compiler
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CC=gcc" >> "$GITHUB_ENV"

      - name: Build + test with the Lean toolchain named in lean-toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: "false"
          build: "true"
          test: "true"
          use-github-cache: "false"
