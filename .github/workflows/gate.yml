# CI runs the same command a human and an agent run (tools/gate.sh), one job per shard of its
# stages; calling a tool directly here would let CI and the local gate drift into two claims.
name: gate

on:
  push:
    # ci/* = an agent's unit under test before it lands on main (.claude/rules/ops.md: CI gate).
    branches: [main, "ci/**"]
  pull_request:
  # Advisory databases + scanner rules move without commits; a weekly run surfaces that.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shards run in parallel, each on a fresh checkout (tools/gate.sh STAGES; its `fanout` stage holds
  # this matrix equal to the shards there).
  gate:
    name: gate (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [lean, e2e, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads the whole history.
          fetch-depth: 0

      # Pinned elan, every download bounded + retried (tools/install-lean.sh); the step's bound
      # ends a stall within minutes.
      - name: Install the Lean toolchain named in lean-toolchain
        timeout-minutes: 10
        run: bash tools/install-lean.sh

      # The exported page's engine is built by `lake build`: Emscripten runs on Python >= 3.10.
      - name: Install Python for the page engine build
        if: matrix.shard != 'checks'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      # The page engine's build folder (Emscripten, Lean runtime sources, Init's C, objects, the
      # engine) costs minutes to fill. Inside it a fetched input counts under its pin's marker and an
      # object under its content digest, and Lake rebuilds what changed, so the key holds what changes
      # every object: pins, toolchain, build tool. The folder's entries are listed (`*`) so the
      # download archive can be left out. The weekly run builds from scratch: downloads + pin checks
      # every week (.claude/rules/wasm.md).
      - name: Cache the page engine build
        id: engine-cache
        if: matrix.shard != 'checks' && github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build/wasm/*
            !.lake/build/wasm/download
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'tools/wasm.lock', 'tools/wasm/**', 'FvtraceWasm/**', 'WasmMain.lean') }}

      # A restore that fails midway keeps its partial files and sets no `cache-hit`: start empty, as
      # on a miss, so neither the build nor the post step's save works from a partial folder.
      - name: Remove a partial page engine build
        if: matrix.shard != 'checks' && github.event_name != 'schedule' && steps.engine-cache.outputs.cache-hit != 'true'
        run: rm -rf .lake/build/wasm

      # The lean shard's Node stage (engine) imports no package.
      - name: Install pnpm
        if: matrix.shard != 'lean'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the dev toolchain
        if: matrix.shard != 'lean'
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        if: matrix.shard == 'e2e'
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      # `lake check` sandboxes the replay in bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu restricts them through AppArmor by default.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap shellcheck jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the gate shard
        run: bash tools/gate.sh --shard "$SHARD"

  # The shipped binary must build, pass its tests and package into a checked release archive on
  # every platform a release serves (build.yml).
  portability:
    uses: $/.github/workflows/build.yml
