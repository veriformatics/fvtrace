# Campaign tier (.claude/rules/testing.md): a time-boxed libFuzzer campaign per fuzz target
# (tools/fuzz.sh: FvtraceFuzz.lean's targets + the C shims, under AddressSanitizer +
# UndefinedBehaviorSanitizer). A crash fails its job + keeps its input as an artifact; its fix pins
# the input under tests/fuzz/<target>/, which every gate run replays (stage `fuzz`).
name: fuzz

on:
  # GitHub runs a schedule on the default branch alone.
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    # ci/fuzz-* = a campaign over an agent's unit under test (its gate runs beside it: gate.yml).
    branches: ["ci/fuzz-**"]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [json, decode, request, page, digest]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      # The time box per target, in seconds.
      FUZZ_SECONDS: 600
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned elan, every download bounded + retried (tools/install-lean.sh).
      - name: Install the Lean toolchain named in lean-toolchain
        timeout-minutes: 10
        run: bash tools/install-lean.sh

      - name: Run the campaign
        run: bash tools/fuzz.sh run "$TARGET" "$FUZZ_SECONDS"

      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: .lake/build/fuzz/crashes/
          if-no-files-found: ignore
