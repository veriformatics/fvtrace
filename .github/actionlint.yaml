# actionlint 1.7.12 (latest release; its label table predates the ubuntu-26.04 GA images, upstream
# issue rhysd/actionlint#682) rejects those GitHub-hosted labels. Declared here so every other label
# stays checked; drop an entry once an actionlint release knows its label.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
# actionlint 1.7.12 predates GitHub's self-repository `uses: $/…` form (rhysd/actionlint#711),
# which zizmor's `self-repository` audit requires; only that form's call error is ignored, so a
# malformed `owner/repo/…@ref` or `./…` call still fails.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/[^"]+" at "uses" is not following the format'
